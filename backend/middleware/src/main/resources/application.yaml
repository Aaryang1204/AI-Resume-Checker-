spring:
  application:
    name: middleware

  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/rhandler
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    # validate = Hibernate checks entity fields match the DB schema on startup, but won't alter anything
    # Use "create" only during initial setup, then switch back to "validate"
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Tells Hibernate which schema to look in for all tables
        # Matches the "ra" schema we created in the SQL script
        default_schema: ra

  # Google OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

# JWT
jwt:
  secret: ${JWT_SECRET} #Don't use this secret in prod - Generate new 
  expiration: 86400000
