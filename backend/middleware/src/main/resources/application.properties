spring.application.name=middleware

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/rhandler
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# validate = Hibernate checks entity fields match the DB schema on startup, but won't alter anything
# Use "create" only during initial setup, then switch back to "validate"
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Tells Hibernate which schema to look in for all tables
# Matches the "ra" schema we created in the SQL script
spring.jpa.properties.hibernate.default_schema=ra

# JWT
jwt.secret=your-256-bit-secret-replace-this-with-env-variable
jwt.expiration=86400000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile